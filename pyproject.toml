[project]
name = "cs2-api"
version = "1.0.0"
description = "CS2 game file tracker and API generator"
requires-python = ">=3.10"
dependencies = [
    # ValvePython/steam on PyPI is abandoned and its plaintext-password
    # ClientLogon is rejected by Valve (InvalidPassword); the maintained fork
    # supports the current token-based login flow.
    "steam[client] @ git+https://github.com/solsticegamestudios/steam.git@1373e885f26bb636225443787f54d4082283e5f3",
    "vdf>=3.3",
    "vpk>=1.0",
    "python-dotenv>=1.0",
    "zstandard>=0.20",
    "lz4>=4.0",
    "texture2ddecoder>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["file_tracker*", "api_gen*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
